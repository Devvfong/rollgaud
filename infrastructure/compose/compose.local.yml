name: devdeploy-local

services:
  postgres:
    image: postgres:17.7-alpine3.22@sha256:6b591f995765a189e69276dd55e0b362342d65d10d0359bb1fab67bc3391f20f
    environment:
      POSTGRES_DB: devdeploy
      POSTGRES_USER: devdeploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD at runtime.}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdeploy -d devdeploy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

volumes:
  postgres-data:
