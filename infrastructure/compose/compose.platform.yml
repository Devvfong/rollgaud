name: devdeploy-platform

services:
  traefik:
    image: traefik:v3.3@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../traefik/static.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ./secrets/traefik:/var/lib/traefik/acme:rw
    networks: [edge, api-private]
    restart: unless-stopped

  api:
    image: ghcr.io/example/devdeploy-api:nonworking-placeholder
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL at runtime}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?Set GITHUB_REPOSITORY at runtime}
      GHCR_IMAGE_NAMESPACE: ${GHCR_IMAGE_NAMESPACE:?Set GHCR_IMAGE_NAMESPACE at runtime}
      GITHUB_WORKFLOW_PATH: ${GITHUB_WORKFLOW_PATH:?Set GITHUB_WORKFLOW_PATH at runtime}
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:?Set GITHUB_READ_TOKEN at runtime}
    logging:
      driver: journald
      options:
        tag: project=rollgaud,service=api,environment=production
    networks: [edge, api-private, monitoring-private]
    restart: unless-stopped

  web:
    image: ghcr.io/example/devdeploy-web:nonworking-placeholder
    networks: [edge]
    restart: unless-stopped

  student-api:
    image: ghcr.io/example/student-api:nonworking-placeholder
    environment:
      COMMIT_SHA: ${STUDENT_API_COMMIT_SHA:?Set STUDENT_API_COMMIT_SHA at runtime}
      APP_VERSION: ${STUDENT_API_VERSION:-v1}
    logging:
      driver: journald
      options:
        tag: project=student-api,service=student-api,environment=production
    networks: [api-private, monitoring-private]
    restart: unless-stopped

  postgres:
    image: postgres:17.7-alpine3.22@sha256:6b591f995765a189e69276dd55e0b362342d65d10d0359bb1fab67bc3391f20f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devdeploy}
      POSTGRES_USER: ${POSTGRES_USER:-devdeploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD at runtime}
    volumes:
      - platform-db:/var/lib/postgresql/data
    networks: [db-private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus-data:/prometheus
    networks: [monitoring-private]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yml"]
    configs:
      - source: loki-config
        target: /etc/loki/loki.yml
    volumes:
      - loki-data:/loki
    networks: [monitoring-private]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    networks: [monitoring-private]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks: [monitoring-private]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD at runtime}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring-private]
    restart: unless-stopped

volumes:
  platform-db:
  prometheus-data:
  loki-data:
  grafana-data:

configs:
  prometheus-config:
    file: ../monitoring/prometheus.yml
  prometheus-alerts:
    file: ../monitoring/alerts.yml
  loki-config:
    file: ../monitoring/loki.yml
  alloy-config:
    file: ../monitoring/alloy.alloy

networks:
  edge:
  api-private:
    internal: true
  db-private:
    internal: true
  monitoring-private:
    internal: true
